name: CI Quality

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify
        run: npm run verify

      # Builds and then asserts the prerendered documents carry real content,
      # canonical URLs, hreflang and JSON-LD — a regression that empties the
      # HTML fails here instead of in production.
      - name: Build
        env:
          VITE_SITE_URL: https://ci.example.test
        run: npm run build
